<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480" fill="none">
  <title>Minimal four-point compass rose</title>
  <!-- One circle and four broad points preserve the atlas motif without labels or ticks. -->
  <g stroke="#383838" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="240" cy="240" r="164"/>
    <path d="M240 103 269 211 377 240 269 269 240 377 211 269 103 240 211 211Z" fill="#eaeaea"/>
    <!-- Alternating flat halves suggest folded paper, with no gradients or hatching. -->
    <path d="M240 103 269 211 240 240Z M377 240 269 269 240 240Z M240 377 211 269 240 240Z M103 240 211 211 240 240Z" fill="#d8d8d8" stroke="none"/>
    <path d="M240 103V377 M103 240H377"/>
  </g>
</svg>
